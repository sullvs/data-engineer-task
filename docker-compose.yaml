services:
  postgres:
    image: postgres:15
    platform: linux/arm64
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    platform: linux/arm64
    command: ["redis-server", "--ignore-warnings", "ARM64-COW-BUG"]

  app:
    build: ./app
    depends_on:
      - postgres
      - redis
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: app_db
      DB_USER: app_user
      DB_PASSWORD: app_password

volumes:
  postgres_data:
